allowBuilds:
  core-js-pure: false
  esbuild: true
  puppeteer: false

# Transitive-dependency version pins. These live here rather than in
# package.json's `pnpm` field because pnpm 11 silently ignores that field --
# it drops every override from the lockfile without emitting a warning, and
# CI then fails on `pnpm i --frozen-lockfile` with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Verified honoured by both pnpm 10.34.5
# and 11.21.0 from this location.
overrides:
  'minimatch@<3.1.4': '3.1.4'
  'minimatch@>=5.0.0 <5.1.8': '5.1.8'
  'minimatch@>=9.0.0 <9.0.7': '9.0.7'
  'flatted@<=3.4.1': '3.4.2'
  'serialize-javascript@<=7.0.2': '7.0.4'
  'basic-ftp@<5.3.0': '5.3.0'
  'follow-redirects@<1.16.0': '1.16.0'
