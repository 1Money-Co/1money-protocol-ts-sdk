name: CI

# Lint, unit tests (with the type check of the response models) and
# build. Runs on a pull request into any branch, so a stacked pull
# request is checked too. The integration tests need a live network
# and stay out of this job.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install --global pnpm@10
      - run: pnpm i --frozen-lockfile
      - run: npm run lint
      - run: npm test
      - run: npm run build
